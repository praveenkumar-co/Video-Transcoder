apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
      #  thsi is the blue print of pod, so the pod will have this label
  template:
    metadata:
      labels:
        app: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "4000"
    spec:
      containers:
        - name: api
          image: video-api
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: NODE_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: vp-config
                  key: NODE_OPTIONS
            - name: CORS_ORIGIN
              valueFrom:
                configMapKeyRef:
                  name: vp-config
                  key: CORS_ORIGIN
          resources:
            limits:
              memory: "384Mi"
              cpu: "300m"
            requests:
              memory: "256Mi"
              cpu: "100m"
          envFrom:
            - configMapRef:
                name: vp-config
            - secretRef:
                name: vp-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ClusterIP
  ports:
    - port: 4000
      targetPort: 4000
  selector:
    app: api  
