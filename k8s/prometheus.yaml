apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: 'api'
        static_configs:
          - targets: ['api:4000']

      - job_name: 'transcoder-worker'
        static_configs:
          - targets: ['transcoder-worker:9091']

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []   # add Alertmanager URL here when ready

  alerts.yml: |
    groups:
      - name: transcoder
        rules:
          - alert: QueueDepthHigh
            expr: vp_queue_depth > 20
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Queue depth above 20 for 2 minutes"

          - alert: JobFailureRateHigh
            expr: rate(vp_transcoder_jobs_failed_total[5m]) > 0.1
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "More than 10% of transcoding jobs are failing"

          - alert: WorkerDown
            expr: up{job="transcoder-worker"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Transcoder worker is not reachable by Prometheus"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=7d"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            limits:
              memory: "512Mi"
              cpu: "300m"
            requests:
              memory: "256Mi"
              cpu: "100m"
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  type: NodePort
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30900
  selector:
    app: prometheus