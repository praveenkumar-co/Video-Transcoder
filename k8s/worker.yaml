apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcoder-worker
spec:
  # SAFETY: Keep replicas=1. FFmpeg is already multi-output internally.
  # Scaling to 2+ workers on a MacBook Air would cook the CPU.
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec: 
      initContainers:
        - name: wait-for-redis
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z redis 6379; do
                echo "Waiting for Redis...";
                sleep 2;
              done;
              echo "Redis is up!"
      containers:
        - name: worker
          image: video-worker
          imagePullPolicy: Never
          resources:
            limits:
              # SAFETY: 800m = 0.8 cores max — won't spike MacBook Air past ~40% CPU
              # even with veryfast preset encoding 3 resolutions.
              memory: "1536Mi"
              cpu: "800m"
            requests:
              memory: "512Mi"
              cpu: "200m"
          envFrom:
            - configMapRef:
                name: vp-config
            - secretRef:
                name: vp-secrets
