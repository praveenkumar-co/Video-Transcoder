apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: videoforge-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "5120m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: videoforge.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 4000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 4000
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 4000
