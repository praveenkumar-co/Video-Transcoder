apiVersion: v1
kind: ConfigMap
metadata:
  name: vp-config
data:
  NODE_ENV: "development"
  NODE_OPTIONS: "--dns-result-order=ipv4first"
  PORT: "4000"
  CORS_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://videoforge.local,http://localhost:3001,http://127.0.0.1:3001"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  AWS_REGION: "us-east-1"
  S3_RAW_BUCKET: "video-transcoder-raw-praveen"
  S3_PROCESSED_BUCKET: "video-transcoder-processed-praveen"
  CLOUDFRONT_DOMAIN: "d1uj526m71dd4i.cloudfront.net"
  FFMPEG_PATH: "/usr/bin/ffmpeg"
  FFPROBE_PATH: "/usr/bin/ffprobe"
  FFMPEG_THREADS: "2"
  WORKER_CONCURRENCY: "1"
  S3_UPLOAD_CONCURRENCY: "30"
  SQS_WAIT_TIME_SECONDS: "20"
  SQS_VISIBILITY_TIMEOUT_SECONDS: "600"
  SQS_POLL_IDLE_DELAY_MS: "500"
  UPLOAD_RECONCILE_INTERVAL_MS: "30000"
  UPLOAD_RECONCILE_PENDING_AFTER_MS: "15000"
  UPLOAD_RECONCILE_QUEUED_AFTER_MS: "120000"
  PRESIGNED_URL_EXPIRY: "3000"
